title: 乳清蛋白松饼(三大张)
title_en: Whey Protein Pancakes (3 large)
servings: 3
serving_name: 张
serving_name_en: pancakes
# nut = 本配方用量对应的 [热量kcal, 蛋白质g, 碳水g, 脂肪g, 膳食纤维g, 钠mg]
# 第二版:75 g 蛋白粉、3 蛋、90 g 酸奶、200 ml 牛奶;面糊偏稀,下次减少牛奶
ingredients:
  whey:    {name: 乳清蛋白粉, name_en: Whey protein powder, qty: 75, unit: g, nut: [270, 60.6, 4.5, 0.6, 0, 459], src: label 分离乳清 1勺31g 折算}
  flour:   {name: 低筋面粉, name_en: Cake flour, qty: 75, unit: g, nut: [271.5, 6.2, 58.5, 0.6, 1.3, 1.5], src: "USDA#169723"}
  allu:    {name: 阿洛酮糖, name_en: Allulose, qty: 20, unit: g, nut: [0, 0, 0, 0, 0, 0], src: FDA 按 0 kcal 计}
  cinn:    {name: 肉桂粉, name_en: Ground cinnamon, qty: 0.5, unit: tsp, nut: [3, 0, 1.1, 0, 0.7, 0], src: USDA 肉桂粉 约1.3g 估}
  bp:      {name: 泡打粉, name_en: Baking powder, qty: 0.5, unit: tsp, nut: [1, 0, 0.6, 0, 0, 180], src: "USDA#172804 约2.3g"}
  salt:    {name: 盐, name_en: Salt, qty: 1, unit: 撮, nut: [0, 0, 0, 0, 0, 155], src: 约0.4g 估}
  egg:     {name: 鸡蛋, name_en: Egg, qty: 3, unit: 个, nut: [234, 18, 3, 15, 0, 186], src: "USDA#01129"}
  yog:     {name: 脱脂希腊酸奶, name_en: Nonfat Greek yogurt, qty: 90, unit: g, nut: [54, 9, 3.6, 0, 0, 29.5], src: "USDA#01287"}
  milk:    {name: 全脂牛奶, name_en: Whole milk, qty: 200, unit: ml, nut: [125.7, 6.5, 9.9, 6.7, 0, 88.6], src: "USDA#01077 按 206 g"}
  butter:  {name: 含盐黄油, name_en: Salted butter, qty: 10, unit: g, nut: [71.7, 0.1, 0, 8.1, 0, 64.3], src: "USDA#01001"}
steps:
  dry:   {action: 拌匀, action_en: Whisk, in: [whey, flour, allu, cinn, bp, salt], min: 1}
  wet:   {action: 搅匀, action_en: Whisk, in: [egg, yog, milk], min: 1}
  mix:   {action: 拌合, action_en: Stir, note: 无干粉即停, note_en: just combined, in: [dry, wet], min: 1}
  rest:  {action: 静置, action_en: Rest, in: [mix], min: 7, passive: true}
  heat:  {phase: heat, action: 热锅, action_en: Preheat, note: 小火 · 抹黄油, note_en: "low · butter pan", in: [butter], min: 3, passive: true, end_with: rest}
  fry:   {phase: heat, action: 煎, action_en: Cook, note: 小火 · 加盖 · 逐张 2 分钟, note_en: "low · covered · 2 min each", in: [rest, heat], min: 6}
  flip:  {phase: heat, action: 翻面, action_en: Flip, note: 逐张 2 分钟, note_en: 2 min each, in: [fry], min: 6}

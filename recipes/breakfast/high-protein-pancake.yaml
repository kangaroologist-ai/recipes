title: 高蛋白松饼
title_en: High-Protein Pancake
servings: 1
serving_name: 张
serving_name_en: pancake
# nut = 本配方用量对应的 [热量kcal, 蛋白质g, 碳水g, 脂肪g, 膳食纤维g, 钠mg]
# 一张的量,由 10-17 做三大张的版本折算:牛奶减到 50 ml(原来偏稀),黄油 5 g,阿洛酮糖 10 g
ingredients:
  egg:     {name: 鸡蛋, name_en: Egg, qty: 1, unit: 个, nut: [78, 6, 1, 5, 0, 62], src: "USDA#01129"}
  yog:     {name: 脱脂希腊酸奶, name_en: Nonfat Greek yogurt, qty: 30, unit: g, nut: [18, 3, 1.2, 0, 0, 9.8], src: "USDA#01287"}
  milk:    {name: 全脂牛奶, name_en: Whole milk, qty: 50, unit: ml, nut: [31.4, 1.6, 2.5, 1.7, 0, 22], src: "USDA#01077 按 51.5 g"}
  whey:    {name: 乳清蛋白粉, name_en: Whey protein powder, qty: 25, unit: g, nut: [90, 20.2, 1.5, 0.2, 0, 153], src: label 分离乳清 1勺31g 折算}
  flour:   {name: 低筋面粉, name_en: Cake flour, qty: 25, unit: g, nut: [90.5, 2.1, 19.5, 0.2, 0.4, 0.5], src: "USDA#169723"}
  allu:    {name: 阿洛酮糖, name_en: Allulose, qty: 10, unit: g, nut: [0, 0, 0, 0, 0, 0], src: FDA 按 0 kcal 计}
  cinn:    {name: 肉桂粉, name_en: Ground cinnamon, qty: 0.5, unit: tsp, nut: [3, 0, 1.1, 0, 0.7, 0], src: USDA 肉桂粉 约1.3g 估}
  bp:      {name: 泡打粉, name_en: Baking powder, qty: 0.5, unit: tsp, nut: [1, 0, 0.6, 0, 0, 180], src: "USDA#172804 约2.3g"}
  salt:    {name: 盐, name_en: Salt, qty: 1, unit: 撮, nut: [0, 0, 0, 0, 0, 155], src: 约0.4g 估}
  butter:  {name: 含盐黄油, name_en: Salted butter, qty: 5, unit: g, nut: [35.9, 0, 0, 4.1, 0, 32.2], src: "USDA#01001"}
steps:
  wet:   {action: 搅匀, action_en: Whisk, in: [egg, yog, milk], min: 1}
  mix:   {action: 拌合, action_en: Stir, note: 粉拌入液体 · 无干粉即停, note_en: "powders into liquids · just combined", in: [wet, whey, flour, allu, cinn, bp, salt], min: 2}
  rest:  {action: 静置, action_en: Rest, in: [mix], min: 7, passive: true}
  heat:  {phase: heat, action: 热锅, action_en: Preheat, note: 小火 · 抹黄油, note_en: "low · butter pan", in: [butter], min: 3, passive: true, end_with: rest}
  fry:   {phase: heat, action: 煎, action_en: Cook, note: 小火 · 加盖, note_en: "low · covered", in: [rest, heat], min: 2}
  flip:  {phase: heat, action: 翻面, action_en: Flip, in: [fry], min: 2}
